<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ausgaben</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjE1IiBmaWxsPSIjQTEzRDJFIi8+Cjx0ZXh0IHg9IjE2IiB5PSIyMiIgZm9udC1mYW1pbHk9IkNvdXJpZXIgTmV3LCBtb25vc3BhY2UiIGZvbnQtd2VpZ2h0PSJib2xkIiBmb250LXNpemU9IjE3IiBmaWxsPSIjRkJGOUYyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj4mIzgzNjQ7PC90ZXh0Pgo8L3N2Zz4=">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper: #E7E2D3;
    --paper-card: #FBF9F2;
    --ink: #2A2822;
    --ink-soft: #6B665A;
    --rule: #C9C2AC;
    --track: #DFD9C7;
    --stamp: #A13D2E;
    --stamp-dark: #7E2F22;
    --ok: #3E5C3E;
    --amber: #B8862B;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.05) 1px, transparent 0);
    background-size: 14px 14px;
    color: var(--ink);
    font-family: "Courier New", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    min-height: 100vh;
  }
  [hidden]{ display:none !important; }

  /* ---- shared form controls ---- */
  label{ display:block; font-size: 12px; color: var(--ink-soft); margin: 12px 0 5px; }
  input, select{
    width: 100%; font-family: inherit; font-size: 14px; background: transparent;
    border: none; border-bottom: 1px solid var(--rule); padding: 6px 2px; color: var(--ink); outline: none;
  }
  input:focus, select:focus{ border-bottom-color: var(--stamp); }
  select{ appearance:none; -webkit-appearance:none; }
  button.submit{
    width:100%; margin-top: 20px; padding: 12px; background: var(--stamp); color: #FBF9F2;
    border: none; font-family: inherit; font-size: 13px; letter-spacing: 0.12em; cursor: pointer;
  }
  button.submit:hover{ background: var(--stamp-dark); }
  button.submit[disabled]{ opacity: 0.5; cursor: default; }
  .status{ text-align:center; font-size: 12px; min-height: 16px; margin-top: 10px; }
  .status.ok{ color: var(--ok); }
  .status.err{ color: var(--stamp); }

  /* ---- config / auth ---- */
  .config-warning{
    max-width: 420px; margin: 20px auto; padding: 14px 16px; background: #F6E9D8;
    border: 1px solid var(--rule); font-size: 12px; color: var(--ink);
  }
  .config-warning code{ background: rgba(0,0,0,0.06); padding: 1px 4px; }

  .sheet{ max-width: 420px; margin: 36px auto 80px; padding: 0 16px; }
  .receipt{
    background: var(--paper-card);
    box-shadow: 0 18px 40px -20px rgba(0,0,0,0.35), 0 2px 0 rgba(0,0,0,0.04);
    position: relative; padding: 28px 26px 22px;
  }
  .receipt::before, .receipt::after{
    content: ""; position: absolute; left: 0; right: 0; height: 10px;
    background-image: radial-gradient(circle at 5px 5px, var(--paper) 5px, transparent 5.5px);
    background-size: 10px 10px; background-repeat: repeat-x;
  }
  .receipt::before{ top: -5px; }
  .receipt::after{ bottom: -5px; background-position: 0 -5px; }
  .title{ text-align:center; font-size: 20px; letter-spacing: 0.14em; margin: 2px 0 2px; }
  .sub{ text-align:center; color: var(--ink-soft); font-size: 12px; margin-bottom: 18px; }

  /* ---- dashboard header ---- */
  .header{ max-width: 1180px; margin: 0 auto; padding: 20px 16px 12px; }
  .header-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
  .app-title{ font-size: 17px; letter-spacing: 0.14em; }
  .signout{ background:none; border:none; color: var(--ink-soft); font-family: inherit; font-size: 11px; letter-spacing: 0.06em; cursor:pointer; }
  .signout:hover{ color: var(--stamp); }

  .month-nav{ display:flex; align-items:center; gap: 10px; }
  .year-arrow{ background:none; border:none; color: var(--ink-soft); cursor:pointer; font-size: 15px; padding: 4px 6px; }
  .year-arrow:hover{ color: var(--ink); }
  .year-label{ font-size: 12px; color: var(--ink-soft); min-width: 38px; text-align:center; }
  .months{ display:flex; gap: 5px; overflow-x:auto; padding-bottom: 2px; }
  .month-btn{
    background:none; border: 1px solid var(--rule); color: var(--ink-soft); font-family: inherit;
    font-size: 11px; padding: 6px 10px; cursor:pointer; white-space:nowrap; flex: none;
  }
  .month-btn.active{ background: var(--stamp); color: #FBF9F2; border-color: var(--stamp); }

  .total-bar-wrap{ max-width: 1180px; margin: 0 auto; padding: 0 16px 18px; }
  .total-bar-inner{ width: calc(75% - 4px); }
  @media (max-width: 760px){ .total-bar-inner{ width: 100%; } }
  .total-bar-head{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; letter-spacing: 0.08em;
  }
  .total-bar-head #totalBudgetAmt{ font-weight:bold; color: var(--ink); letter-spacing: normal; }
  .total-bar-head #totalBudgetAmt .over{ color: var(--stamp); }
  .total-bar-track{
    height: 14px; background: var(--track); position:relative; overflow:hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
  }
  .total-bar-fill{
    height: 100%; background: var(--stamp); width: 0%; transition: width 0.25s ease, background 0.15s ease;
  }
  .total-bar-fill.over{ background: var(--stamp-dark); }

  /* ---- category grid ---- */
  .categories-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    max-width: 1180px; margin: 0 auto; padding: 4px 16px 110px;
  }
  @media (max-width: 760px){ .categories-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px){ .categories-grid{ grid-template-columns: 1fr; } }

  .cat-card{
    background: var(--paper-card); box-shadow: 0 10px 26px -16px rgba(0,0,0,0.35);
    padding: 16px 14px 14px; display:flex; flex-direction:column;
  }
  .cat-name{ text-align:center; font-size: 12px; letter-spacing: 0.1em; color: var(--ink); margin-bottom: 10px; }

  .donut-wrap{ position:relative; width: 140px; height: 140px; margin: 0 auto; }
  .donut-wrap svg{ transform: rotate(-90deg); }
  .donut-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .donut-center .spent{ font-size: 16px; font-weight:bold; }
  .donut-center .of{ font-size: 10px; color: var(--ink-soft); margin-top: 2px; cursor:pointer; text-decoration: underline dotted; }
  .donut-center .of:hover{ color: var(--stamp); }


  .cat-entries{ margin-top: 12px; flex: 1; }
  .cat-entry{
    display:flex; justify-content:space-between; gap: 6px; font-size: 11px; padding: 5px 0;
    border-bottom: 1px dotted var(--rule);
  }
  .cat-entry .e-desc{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .cat-entry .e-date{ display:block; font-size: 9px; color: var(--ink-soft); }
  .cat-entry .e-amt{ white-space:nowrap; font-weight:bold; cursor:pointer; }
  .cat-empty{ text-align:center; font-size: 10px; color: var(--ink-soft); padding: 10px 0; }

  .cat-total{
    display:flex; justify-content:space-between; margin-top: 10px; padding-top: 8px;
    border-top: 1px solid var(--ink); font-size: 12px; font-weight:bold;
  }

  /* ---- FAB ---- */
  .fab{
    position: fixed; right: 22px; bottom: 22px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--stamp); color: #FBF9F2; font-size: 28px; line-height: 1; border: none; cursor:pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center;
  }
  .fab:hover{ background: var(--stamp-dark); }

  /* ---- overlay ---- */
  .overlay-backdrop{
    position: fixed; inset: 0; background: rgba(30,28,24,0.55); display:flex;
    align-items:center; justify-content:center; padding: 20px; z-index: 50;
  }
  .overlay-card{ background: var(--paper-card); max-width: 360px; width: 100%; padding: 24px 22px 20px; position:relative; }
  .overlay-close{ position:absolute; top: 8px; right: 10px; background:none; border:none; font-size: 16px; color: var(--ink-soft); cursor:pointer; }
  .overlay-close:hover{ color: var(--stamp); }

  .overlay-title{ text-align:center; font-size: 15px; letter-spacing: 0.1em; margin-bottom: 14px; }
  .month-row{
    display:flex; justify-content:space-between; font-size: 12px; padding: 6px 0;
    border-bottom: 1px dotted var(--rule);
  }
  .month-row .amt{ font-weight:bold; }
  .grand-total{
    display:flex; justify-content:space-between; margin-top: 10px; padding-top: 8px;
    border-top: 1px solid var(--ink); font-size: 13px; font-weight:bold;
  }
  .choice-btn{
    width:100%; padding: 11px; margin-top: 10px; border: 1px solid var(--rule);
    background: transparent; color: var(--ink); font-family: inherit; font-size: 12px;
    letter-spacing: 0.08em; cursor:pointer;
  }
  .choice-btn.danger{ background: var(--stamp); color: #FBF9F2; border-color: var(--stamp); }
  .choice-btn:hover{ border-color: var(--ink); }
  .choice-btn.danger:hover{ background: var(--stamp-dark); }
</style>
</head>
<body>

<div id="configWarning" hidden class="config-warning">
  Supabase ist noch nicht konfiguriert. Trage <code>SUPABASE_URL</code> und
  <code>SUPABASE_ANON_KEY</code> im Script-Teil dieser Datei ein.
</div>

<!-- Login / Registrierung -->
<div class="sheet" id="authView" hidden>
  <div class="receipt">
    <div class="title">ANMELDEN</div>
    <div class="sub" id="authSub">Zugang zu deinen Ausgaben</div>
    <form id="authForm">
      <label for="authEmail">E-Mail</label>
      <input type="email" id="authEmail" required autocomplete="username">
      <label for="authPassword">Passwort</label>
      <input type="password" id="authPassword" required autocomplete="current-password" minlength="6">
      <button type="submit" class="submit" id="authSubmitBtn">ANMELDEN</button>
      <div class="status" id="authStatus"></div>
    </form>
  </div>
</div>

<!-- Dashboard -->
<div id="appView" hidden>
  <div class="header">
    <div class="header-top">
      <div class="app-title">AUSGABEN</div>
      <button class="signout" id="signOutBtn">ABMELDEN</button>
    </div>
    <div class="month-nav">
      <button class="year-arrow" id="prevYear">‹</button>
      <span class="year-label" id="yearLabel"></span>
      <button class="year-arrow" id="nextYear">›</button>
      <div class="months" id="monthsRow"></div>
    </div>
  </div>

  <div class="total-bar-wrap">
    <div class="total-bar-inner">
      <div class="total-bar-head">
        <span>GESAMT</span>
        <span class="amt" id="totalBudgetAmt"></span>
      </div>
      <div class="total-bar-track"><div class="total-bar-fill" id="totalBudgetFill"></div></div>
    </div>
  </div>

  <div class="categories-grid" id="categoriesGrid"></div>

  <button class="fab" id="fabAdd" title="Ausgabe hinzufügen">+</button>
</div>

<!-- Overlay: neue Ausgabe -->
<div class="overlay-backdrop" id="overlayBackdrop" hidden>
  <div class="overlay-card">
    <button class="overlay-close" id="overlayClose">✕</button>
    <div class="title" style="font-size:16px;">NEUE AUSGABE</div>
    <form id="entryForm">
      <label for="ovDatum">Datum</label>
      <input type="date" id="ovDatum" required>

      <label for="ovKategorie">Kategorie</label>
      <select id="ovKategorie" required></select>

      <label for="ovDetail">Beschreibung</label>
      <div id="ovDetailWrap"></div>

      <label for="ovBetrag">Betrag (€)</label>
      <input type="number" id="ovBetrag" step="0.01" min="0" required>

      <button type="submit" class="submit" id="entrySubmitBtn">EINTRAGEN</button>
      <div class="status" id="entryStatus"></div>
    </form>
  </div>
</div>

<!-- Overlay: Monatssumme je Position -->
<div class="overlay-backdrop" id="sumOverlay" hidden>
  <div class="overlay-card">
    <button class="overlay-close" id="sumOverlayClose">✕</button>
    <div class="overlay-title" id="sumTitle"></div>
    <div id="sumRows"></div>
    <div class="grand-total" id="sumGrandTotal"></div>
  </div>
</div>

<!-- Overlay: Löschen oder Preis ändern -->
<div class="overlay-backdrop" id="choiceOverlay" hidden>
  <div class="overlay-card">
    <button class="overlay-close" id="choiceOverlayClose">✕</button>
    <div class="overlay-title" id="choiceTitle"></div>
    <button class="choice-btn" id="choiceEditBtn">PREIS ÄNDERN</button>
    <button class="choice-btn danger" id="choiceDeleteBtn">LÖSCHEN</button>
  </div>
</div>

<script>
  // ---- Konfiguration: nach dem Anlegen des Supabase-Projekts ausfüllen ----
  const SUPABASE_URL = "https://wmdvovlmrhiwdcbmwjpy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_HsHCo-pnAW8Uts_kYFnLZw_bqiQOyXn";
  // --------------------------------------------------------------------

  const CATEGORIES = ["monatlich", "wiederkehrend", "ab und zu", "Einzelfall"];

  // Für diese Kategorien erscheint bei "Beschreibung" ein Dropdown mit fester Auswahl
  // (alphabetisch sortiert). Kategorien ohne Eintrag hier (z.B. "Einzelfall") bekommen
  // stattdessen ein freies Textfeld.
  const CATEGORY_OPTIONS = {
    "monatlich": [
      "1&1", "Apple", "Dogado", "eprimo", "Fitness Loft", "Generali",
      "klarmobil", "Kredit", "Miete", "SV Rentenversicherung",
      "Unterhalt", "Youtube", "ETF-Sparplan", "Vodafone",
    ].sort((a, b) => a.localeCompare(b, "de")),
    "wiederkehrend": ["Einkaufen", "Parken", "Tanken"].sort((a, b) => a.localeCompare(b, "de")),
    "ab und zu": ["Döner", "Kaffee", "Trinken"].sort((a, b) => a.localeCompare(b, "de")),
  };

  const MONTH_NAMES = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

  const configWarning = document.getElementById("configWarning");
  const authView = document.getElementById("authView");
  const appView = document.getElementById("appView");
  let sb = null;

  if (SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 10) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } else {
    configWarning.hidden = false;
  }

  const fmtEUR = (n) => n.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
  const fmtDateShort = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  // Lokales Datum als YYYY-MM-DD, ohne UTC-Verschiebung (toISOString() würde
  // je nach Zeitzone auf den Vor-/Folgetag rutschen).
  const toLocalISODate = (d) =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  // ---------------- Auth ----------------

  const authForm = document.getElementById("authForm");
  const authStatus = document.getElementById("authStatus");
  const authSubmitBtn = document.getElementById("authSubmitBtn");

  function setAuthStatus(msg, kind) {
    authStatus.textContent = msg;
    authStatus.className = "status" + (kind ? " " + kind : "");
  }

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!sb) { setAuthStatus("Supabase ist nicht konfiguriert.", "err"); return; }
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;

    authSubmitBtn.disabled = true;
    setAuthStatus("Meldet an …", "");

    const { error } = await sb.auth.signInWithPassword({ email, password });

    authSubmitBtn.disabled = false;

    if (error) { setAuthStatus("Fehler: " + error.message, "err"); return; }
  });

  document.getElementById("signOutBtn").addEventListener("click", async () => {
    if (!sb) return;
    await sb.auth.signOut();
  });

  function showAuthed() {
    authView.hidden = true;
    appView.hidden = false;
    initDashboardOnce();
    loadDashboard();
  }
  function showLoggedOut() {
    appView.hidden = true;
    authView.hidden = false;
  }

  if (sb) {
    sb.auth.onAuthStateChange((_event, session) => { session ? showAuthed() : showLoggedOut(); });
    sb.auth.getSession().then(({ data: { session } }) => { session ? showAuthed() : showLoggedOut(); });
  } else {
    showLoggedOut();
  }

  // ---------------- Dashboard state ----------------

  const today = new Date();
  let selectedYear = today.getFullYear();
  let selectedMonth = today.getMonth(); // 0-11
  let dashboardInited = false;
  let standardBetraege = {}; // wird aus Supabase geladen, nicht im Code hinterlegt

  const yearLabel = document.getElementById("yearLabel");
  const monthsRow = document.getElementById("monthsRow");
  const categoriesGrid = document.getElementById("categoriesGrid");

  function renderMonthNav() {
    yearLabel.textContent = selectedYear;
    monthsRow.innerHTML = "";
    MONTH_NAMES.forEach((name, idx) => {
      const btn = document.createElement("button");
      btn.className = "month-btn" + (idx === selectedMonth ? " active" : "");
      btn.textContent = name;
      btn.addEventListener("click", () => {
        selectedMonth = idx;
        renderMonthNav();
        loadDashboard();
      });
      monthsRow.appendChild(btn);
    });
  }

  document.getElementById("prevYear").addEventListener("click", () => {
    selectedYear -= 1; renderMonthNav(); loadDashboard();
  });
  document.getElementById("nextYear").addEventListener("click", () => {
    selectedYear += 1; renderMonthNav(); loadDashboard();
  });

  function applyDefaultAmount(cat) {
    if (cat !== "monatlich") return;
    const detail = document.getElementById("ovDetail");
    const betragEl = document.getElementById("ovBetrag");
    const preset = standardBetraege[detail.value];
    betragEl.value = (preset !== undefined && preset > 0) ? preset : "";
  }

  function renderDetailField(cat) {
    const wrap = document.getElementById("ovDetailWrap");
    const options = CATEGORY_OPTIONS[cat];
    wrap.innerHTML = "";
    if (options) {
      const select = document.createElement("select");
      select.id = "ovDetail";
      select.required = true;
      options.forEach((opt) => {
        const o = document.createElement("option");
        o.value = opt; o.textContent = opt;
        select.appendChild(o);
      });
      select.addEventListener("change", () => applyDefaultAmount(cat));
      wrap.appendChild(select);
      applyDefaultAmount(cat);
    } else {
      const input = document.createElement("input");
      input.type = "text";
      input.id = "ovDetail";
      input.placeholder = "z.B. Werkstatt, Geschenk …";
      wrap.appendChild(input);
    }
  }

  async function loadStandardbetraege() {
    standardBetraege = {};
    if (!sb) return;
    const { data, error } = await sb.from("standardbetraege").select("*").eq("kategorie", "monatlich");
    if (error) { console.error(error); return; }
    (data || []).forEach((row) => { standardBetraege[row.beschreibung] = Number(row.betrag); });
  }

  function initDashboardOnce() {
    if (dashboardInited) return;
    dashboardInited = true;
    renderMonthNav();
    const ovKategorie = document.getElementById("ovKategorie");
    CATEGORIES.forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      ovKategorie.appendChild(opt);
    });
    ovKategorie.addEventListener("change", () => {
      document.getElementById("ovBetrag").value = "";
      renderDetailField(ovKategorie.value);
    });
    renderDetailField(ovKategorie.value);
  }

  function monthRange(year, monthIdx) {
    const start = new Date(year, monthIdx, 1);
    const end = new Date(year, monthIdx + 1, 0);
    const iso = (d) => toLocalISODate(d);
    return { start: iso(start), end: iso(end) };
  }

  function ringColor(pct) {
    if (pct > 1) return "var(--ink)";
    if (pct > 0.9) return "var(--stamp)";
    if (pct > 0.75) return "var(--amber)";
    return "var(--ok)";
  }

  function donutSVG(pct) {
    const r = 56, c = 2 * Math.PI * r;
    const clamped = Math.max(0, Math.min(1, pct));
    const dash = clamped * c;
    return `
      <svg viewBox="0 0 140 140" width="140" height="140">
        <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--track)" stroke-width="13"></circle>
        <circle cx="70" cy="70" r="${r}" fill="none" stroke="${ringColor(pct)}"
          stroke-width="13" stroke-linecap="butt"
          stroke-dasharray="${dash} ${c - dash}"></circle>
      </svg>`;
  }

  async function loadDashboard() {
    if (!sb) return;
    const { start, end } = monthRange(selectedYear, selectedMonth);

    const [{ data: ausgabenRows, error: e1 }, { data: budgetRows, error: e2 }] = await Promise.all([
      sb.from("ausgaben").select("*").gte("datum", start).lte("datum", end).order("created_at", { ascending: false }),
      sb.from("budgets").select("*").lte("gueltig_ab", end).order("gueltig_ab", { ascending: true }),
    ]);

    if (e1 || e2) {
      console.error(e1 || e2);
      categoriesGrid.innerHTML = '<div class="cat-empty">Fehler beim Laden.</div>';
      return;
    }

    const budgetMap = {};
    (budgetRows || []).forEach((b) => { budgetMap[b.kategorie] = Number(b.budget); });

    const grouped = {};
    CATEGORIES.forEach((c) => { grouped[c] = []; });
    (ausgabenRows || []).forEach((row) => {
      if (!grouped[row.kategorie]) grouped[row.kategorie] = [];
      grouped[row.kategorie].push(row);
    });

    categoriesGrid.innerHTML = "";
    let totalSpent = 0;
    let totalBudget = 0;
    CATEGORIES.forEach((cat, idx) => {
      const entries = grouped[cat] || [];
      const spent = entries.reduce((sum, r) => sum + Number(r.betrag), 0);
      const budget = budgetMap[cat] || 0;
      if (idx < 3) { // Gesamtbalken bezieht sich nur auf die ersten drei Kategorien
        totalSpent += spent;
        totalBudget += budget;
      }
      const pct = budget > 0 ? spent / budget : (spent > 0 ? 1 : 0);

      const card = document.createElement("div");
      card.className = "cat-card";
      card.innerHTML = `
        <div class="cat-name">${cat}</div>
        <div class="donut-wrap">
          ${donutSVG(pct)}
          <div class="donut-center">
            <div class="spent">${fmtEUR(spent)}</div>
            <div class="of" data-cat="${cat}">von ${fmtEUR(budget)}</div>
          </div>
        </div>
        <div class="cat-entries">
          ${entries.length ? entries.map((r) => `
            <div class="cat-entry" data-id="${r.id}">
              <div class="e-desc">
                ${r.beschreibung ? r.beschreibung : "–"}
                <span class="e-date">${fmtDateShort(r.datum)}</span>
              </div>
              <div class="e-amt">${fmtEUR(Number(r.betrag))}</div>
            </div>
          `).join("") : '<div class="cat-empty">Keine Ausgaben</div>'}
        </div>
        <div class="cat-total"><span>Summe</span><span>${fmtEUR(spent)}</span></div>
      `;
      card.querySelector(".of").addEventListener("click", () => editBudget(cat, budget));
      entries.forEach((r) => {
        const entryEl = card.querySelector(`.cat-entry[data-id="${r.id}"]`);
        if (!entryEl) return;
        entryEl.querySelector(".e-desc").addEventListener("click", () => openSumOverlay(cat, r.beschreibung));
        entryEl.querySelector(".e-amt").addEventListener("click", () => openChoiceOverlay(r.id, r.beschreibung, Number(r.betrag)));
      });
      categoriesGrid.appendChild(card);
    });

    const over = totalSpent > totalBudget;
    const pctTotal = totalBudget > 0 ? Math.min(1, totalSpent / totalBudget) : (totalSpent > 0 ? 1 : 0);
    document.getElementById("totalBudgetAmt").innerHTML =
      `<span class="${over ? "over" : ""}">${fmtEUR(totalSpent)}</span> von ${fmtEUR(totalBudget)}`;
    const fillEl = document.getElementById("totalBudgetFill");
    fillEl.style.width = (pctTotal * 100) + "%";
    fillEl.classList.toggle("over", over);
  }

  // ---------------- Overlay: Monatssumme je Position ----------------

  const sumOverlay = document.getElementById("sumOverlay");
  document.getElementById("sumOverlayClose").addEventListener("click", () => { sumOverlay.hidden = true; });
  sumOverlay.addEventListener("click", (e) => { if (e.target === sumOverlay) sumOverlay.hidden = true; });

  async function openSumOverlay(cat, beschreibung) {
    document.getElementById("sumTitle").textContent = beschreibung || "–";
    document.getElementById("sumRows").innerHTML = '<div class="cat-empty">Lädt …</div>';
    document.getElementById("sumGrandTotal").innerHTML = "";
    sumOverlay.hidden = false;

    let query = sb.from("ausgaben").select("datum, betrag").eq("kategorie", cat);
    query = beschreibung ? query.eq("beschreibung", beschreibung) : query.is("beschreibung", null);
    const { data, error } = await query;

    if (error) {
      document.getElementById("sumRows").innerHTML = '<div class="cat-empty">Fehler beim Laden.</div>';
      console.error(error);
      return;
    }

    const byMonth = {};
    (data || []).forEach((r) => {
      const key = r.datum.slice(0, 7); // YYYY-MM
      byMonth[key] = (byMonth[key] || 0) + Number(r.betrag);
    });

    const keys = Object.keys(byMonth).sort().reverse();
    let grand = 0;
    document.getElementById("sumRows").innerHTML = keys.length
      ? keys.map((k) => {
          const [y, m] = k.split("-");
          grand += byMonth[k];
          return `<div class="month-row"><span>${MONTH_NAMES[parseInt(m, 10) - 1]} ${y}</span><span class="amt">${fmtEUR(byMonth[k])}</span></div>`;
        }).join("")
      : '<div class="cat-empty">Keine Einträge</div>';
    document.getElementById("sumGrandTotal").innerHTML = `<span>Gesamt</span><span>${fmtEUR(grand)}</span>`;
  }

  // ---------------- Overlay: Löschen oder Preis ändern ----------------

  const choiceOverlay = document.getElementById("choiceOverlay");
  let choiceContext = null;

  document.getElementById("choiceOverlayClose").addEventListener("click", () => { choiceOverlay.hidden = true; });
  choiceOverlay.addEventListener("click", (e) => { if (e.target === choiceOverlay) choiceOverlay.hidden = true; });

  function openChoiceOverlay(id, beschreibung, betrag) {
    choiceContext = { id, beschreibung, betrag };
    document.getElementById("choiceTitle").textContent = `${beschreibung || "–"} · ${fmtEUR(betrag)}`;
    choiceOverlay.hidden = false;
  }

  document.getElementById("choiceEditBtn").addEventListener("click", () => {
    const ctx = choiceContext;
    choiceOverlay.hidden = true;
    if (ctx) editEntryAmount(ctx.id, ctx.betrag);
  });
  document.getElementById("choiceDeleteBtn").addEventListener("click", () => {
    const ctx = choiceContext;
    choiceOverlay.hidden = true;
    if (ctx) deleteEntry(ctx.id);
  });

  async function deleteEntry(id) {
    const { error } = await sb.from("ausgaben").delete().eq("id", id);
    if (error) { alert("Fehler beim Löschen: " + error.message); console.error(error); return; }
    loadDashboard();
  }

  async function editEntryAmount(id, currentBetrag) {
    const input = prompt("Neuer Betrag (€):", currentBetrag);
    if (input === null) return;
    const value = parseFloat(input.replace(",", "."));
    if (isNaN(value) || value < 0) { alert("Ungültiger Betrag."); return; }

    const { error } = await sb.from("ausgaben").update({ betrag: value }).eq("id", id);
    if (error) { alert("Fehler beim Speichern: " + error.message); console.error(error); return; }
    loadDashboard();
  }

  async function editBudget(cat, current) {
    const input = prompt(`Neues Budget für "${cat}" ab ${MONTH_NAMES[selectedMonth]} ${selectedYear} (€):`, current || "");
    if (input === null) return;
    const value = parseFloat(input.replace(",", "."));
    if (isNaN(value) || value < 0) { alert("Ungültiger Betrag."); return; }

    const { data: { user } } = await sb.auth.getUser();
    if (!user) return;

    const gueltigAb = toLocalISODate(new Date(selectedYear, selectedMonth, 1));

    const { error } = await sb.from("budgets")
      .insert({ user_id: user.id, kategorie: cat, budget: value, gueltig_ab: gueltigAb });

    if (error) { alert("Fehler beim Speichern: " + error.message); console.error(error); return; }
    loadDashboard();
  }

  // ---------------- Overlay: neue Ausgabe ----------------

  const overlayBackdrop = document.getElementById("overlayBackdrop");
  const entryForm = document.getElementById("entryForm");
  const entryStatus = document.getElementById("entryStatus");
  const entrySubmitBtn = document.getElementById("entrySubmitBtn");

  function setEntryStatus(msg, kind) {
    entryStatus.textContent = msg;
    entryStatus.className = "status" + (kind ? " " + kind : "");
  }

  async function openOverlay() {
    document.getElementById("ovDatum").value = toLocalISODate(today);
    const ovKategorie = document.getElementById("ovKategorie");
    ovKategorie.selectedIndex = 0;
    await loadStandardbetraege();
    renderDetailField(ovKategorie.value);
    setEntryStatus("", "");
    overlayBackdrop.hidden = false;
  }
  function closeOverlay() { overlayBackdrop.hidden = true; }

  document.getElementById("fabAdd").addEventListener("click", openOverlay);
  document.getElementById("overlayClose").addEventListener("click", closeOverlay);
  overlayBackdrop.addEventListener("click", (e) => { if (e.target === overlayBackdrop) closeOverlay(); });

  entryForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!sb) { setEntryStatus("Supabase ist nicht konfiguriert.", "err"); return; }

    const { data: { user } } = await sb.auth.getUser();
    if (!user) { setEntryStatus("Nicht angemeldet.", "err"); return; }

    const payload = {
      user_id: user.id,
      datum: document.getElementById("ovDatum").value,
      kategorie: document.getElementById("ovKategorie").value,
      beschreibung: document.getElementById("ovDetail").value || null,
      betrag: parseFloat(document.getElementById("ovBetrag").value),
    };

    entrySubmitBtn.disabled = true;
    setEntryStatus("Speichert …", "");

    const { error } = await sb.from("ausgaben").insert(payload);

    entrySubmitBtn.disabled = false;
    if (error) { setEntryStatus("Fehler: " + error.message, "err"); console.error(error); return; }

    closeOverlay();
    // Falls das Datum in einen anderen Monat fällt, dorthin wechseln
    const d = new Date(payload.datum + "T00:00:00");
    selectedYear = d.getFullYear();
    selectedMonth = d.getMonth();
    renderMonthNav();
    loadDashboard();
  });
</script>
</body>
</html>
